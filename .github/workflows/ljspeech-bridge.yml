name: LJSpeech bridge

on:
  push:
    branches: [tmp-ljspeech-bridge]
  workflow_dispatch:

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download precomputed LJSpeech TextGrids
        run: |
          set -euxo pipefail
          mkdir -p out
          curl -L --fail --retry 4 --retry-delay 3 \
            'https://zenodo.org/records/7499098/files/grids.zip?download=1' \
            -o out/grids.zip
          ls -lh out/grids.zip
          test $(stat -c%s out/grids.zip) -gt 30000000
      - name: Upload alignments
        uses: actions/upload-artifact@v4
        with:
          name: ljspeech-textgrids
          path: out/grids.zip
          compression-level: 0
          retention-days: 1
