name: LJSpeech bridge

on:
  push:
    branches: [tmp-ljspeech-bridge]
  workflow_dispatch:

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download LJSpeech phoneme shard
        run: |
          set -euxo pipefail
          mkdir -p out
          curl -L --fail --retry 4 --retry-delay 3 \
            'https://huggingface.co/datasets/bookbot/ljspeech_phonemes/resolve/main/data/train-00000-of-00008-b30dbd8fb488aaf7.parquet?download=true' \
            -o out/ljspeech_phonemes_0000.parquet
          ls -lh out/ljspeech_phonemes_0000.parquet
          test $(stat -c%s out/ljspeech_phonemes_0000.parquet) -gt 400000000
      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: ljspeech-phonemes-shard-0000
          path: out/ljspeech_phonemes_0000.parquet
          compression-level: 0
          retention-days: 1
